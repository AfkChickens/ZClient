<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schließen...</title>
    <script>
        function closeOrBlank() {
            window.open('', '_self', '');
            window.close();
            setTimeout(() => {
                window.location.href = "about:blank";
            }, 100);
        }
        window.onload = closeOrBlank;
    </script>
</head>
<body onclick="closeOrBlank()">
</body>
</html>
